<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lhGradMask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b6cff"/>
      <stop offset="100%" stop-color="#22d3a0"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background so the OS can crop to any shape (circle, squircle, rounded square) -->
  <rect width="512" height="512" fill="#090b18"/>
  <!-- Safe zone is the center 80% (≈ 102 → 410). Keep the icon glyph within it. -->
  <g transform="translate(256 256)">
    <circle r="120" fill="url(#lhGradMask)"/>
    <path d="M -70 -24 L 0 -64 L 70 -24 L 70 40 L 0 80 L -70 40 Z" fill="#090b18" stroke="#e8eaf4" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -70 -24 L 0 16 L 70 -24" fill="none" stroke="#e8eaf4" stroke-width="8" stroke-linejoin="round"/>
    <line x1="0" y1="16" x2="0" y2="80" stroke="#e8eaf4" stroke-width="8"/>
  </g>
</svg>
