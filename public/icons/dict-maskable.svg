<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dictMaskBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1e63"/>
      <stop offset="100%" stop-color="#0a4bd4"/>
    </linearGradient>
    <linearGradient id="dictMaskAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- maskable: full-bleed, safe area is the centre 80% (40px padding all sides on 512). -->
  <rect width="512" height="512" fill="url(#dictMaskBg)"/>
  <g transform="translate(256 256)">
    <path d="M -90 -8 A 90 90 0 0 1 90 -8" fill="none" stroke="url(#dictMaskAccent)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-90" cy="-8" r="8" fill="#38bdf8"/>
    <circle cx="90" cy="-8" r="8" fill="#a78bfa"/>
    <text x="0" y="60" font-family="Inter, sans-serif" font-size="66" font-weight="800" text-anchor="middle" fill="#fff" letter-spacing="4">DICT</text>
    <text x="0" y="100" font-family="Inter, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#9bb8ff" letter-spacing="8">REGION V</text>
  </g>
</svg>
