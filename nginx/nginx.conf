# Standalone Nginx config for the DICT Region V Program Management System.
# Drop-in for Cloudflare Tunnel, on-prem deployment, or `docker run`.
# Wire-level compression cuts JS/CSS by 60-70% — biggest win for remote users.
#
# Usage (no docker-compose committed yet):
#   docker run --rm -p 80:80 \
#     -v $(pwd)/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
#     --link <next-container>:app \
#     --link <convex-container>:convex \
#     nginx:alpine
#
# When you add a docker-compose.yml, mount this file under
# /etc/nginx/nginx.conf:ro on an `nginx:alpine` service.

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  # ── Gzip — main wire-level win ────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  # ── Aggressive cache for content-hashed Next.js assets ────────────
  # Next.js ships fingerprinted filenames for /_next/static/*, so
  # immutable+1y is safe. Other paths fall through to no-cache.
  map $uri $cache_control {
    "~*^/_next/static/"                 "public, max-age=31536000, immutable";
    "~*\.(js|css|woff2|woff|ico|svg)$"  "public, max-age=31536000, immutable";
    "~*\.(png|jpg|jpeg|webp|avif)$"     "public, max-age=2592000";
    default                              "no-cache";
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Next.js app
    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_cache_bypass                 $http_upgrade;
      add_header Cache-Control           $cache_control;
    }

    # Convex self-hosted backend (HTTP + WebSocket)
    location /convex/ {
      proxy_pass http://convex-backend:3210/;
      proxy_http_version 1.1;
      proxy_set_header Host       $host;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    # Optional: local Ollama for AI features
    location /ai/llm/ {
      proxy_pass http://ollama:11434/;
      proxy_http_version 1.1;
      proxy_buffering    off;
      proxy_read_timeout 120s;
    }

    # Optional: face recognition microservice
    location /ai/face/ {
      proxy_pass http://face-recognition:8001/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
